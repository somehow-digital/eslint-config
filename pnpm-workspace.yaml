enablePrePostScripts: false
shellEmulator: true
verifyDepsBeforeRun: install
optimisticRepeatInstall: true

overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@8.3.8000

allowBuilds:
  esbuild: true
